# TradingAgents-TW Alembic config (Phase 4)
#
# Design:
# - script_location = migrations/ (relative to backend/)
# - DB URL is resolved by env.py using app.core.config.settings (ta_migration role)
# - We do NOT set sqlalchemy.url here to avoid storing the password in plaintext
# - file_template uses "seq_slug" format e.g. 0001_baseline_users
#
# Usage:
#   cd backend
#   uv run alembic upgrade head
#   uv run alembic downgrade -1
#   uv run alembic revision -m "add foo"

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
sqlalchemy.url =
timezone = UTC

[post_write_hooks]
# disabled in Phase 4

# ---- Logging ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
